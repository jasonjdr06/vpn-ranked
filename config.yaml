baseURL: "https://vpnranked.co/"
languageCode: "en-us"
title: "VPN Ranked"
theme: "PaperMod"
pagination:
  pagerSize: 10

params:
  env: production
  title: VPN Ranked
  description: "Independent VPN reviews and comparisons tested for speed, privacy, and streaming. Updated 2026."
  keywords: [best VPN 2026, VPN reviews, VPN comparison, online privacy, streaming VPN]
  author: VPN Ranked Team
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true

  homeInfoParams:
    Title: "Find the best VPN — no paid placements, ever."
    Content: >
      We test every major VPN for speed, privacy, and streaming performance.
      Unbiased rankings updated for 2026 — find the right VPN in under 60 seconds.

  socialIcons:
    - name: "rss"
      url: "/index.xml"

menu:
  main:
    - identifier: reviews
      name: Reviews
      url: /categories/review/
      weight: 10
    - identifier: comparisons
      name: Comparisons
      url: /categories/comparison/
      weight: 20
    - identifier: guides
      name: Guides
      url: /categories/guide/
      weight: 30
    - identifier: streaming
      name: Streaming
      url: /tags/streaming/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
